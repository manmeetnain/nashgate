name: real-api-check

# Runs the gateway against a real, billed Anthropic API call — every
# push to main only, not on PRs (forks can't see secrets anyway; this
# also keeps cost proportional to merges rather than every review
# push). Needs NASHGATE_ANTHROPIC_TEST_KEY set as a repo secret — see
# CONTRIBUTING.md. If it's not set, tests/test_real_api.py just skips.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  real-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install nashgate + dev dependencies
        run: pip install -e ".[dev]"

      - name: Real API check
        env:
          NASHGATE_ANTHROPIC_TEST_KEY: ${{ secrets.NASHGATE_ANTHROPIC_TEST_KEY }}
        run: pytest tests/test_real_api.py -v
