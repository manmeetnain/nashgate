[project]
name = "nashgate"
version = "0.0.1"
description = "LLM/agent gateway that routes under contention via Nash-equilibrium-seeking multi-agent RL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "torch>=2.3",
    "typer>=0.12",
]

[project.scripts]
nashgate = "nashgate.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
